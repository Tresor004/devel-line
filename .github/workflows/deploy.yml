# Construit la maquette et la publie sur GitHub Pages à chaque push sur main
name: Déployer sur GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Installer les dépendances
        run: npm ci
      - name: Construire
        run: npm run build
      - name: Configurer Pages
        uses: actions/configure-pages@v6
      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
